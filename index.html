<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Мои финансы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --ink:#14161F; --hint:#636B7B; --line:#E6E8ED; --field:#ECEEF2; --seg-on:#FFFFFF;
  --pos:#2B3BFF; --neg:#D63518; --green:#0B8F66; --hero:#2B3BFF;
  --display:'Unbounded','Golos Text',system-ui,sans-serif;
  --body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0D0F14; --surface:#171A21; --ink:#F2F4F8; --hint:#98A0B1; --line:#252A34; --field:#1F232C; --seg-on:#2C313D;
  --green:#3DDC9A;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding-bottom:calc(150px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #8FA0FF;outline-offset:2px}

/* ---- Шапка с балансом: единственный яркий акцент, цвет зависит от знака баланса ---- */
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;padding:16px 20px 30px;border-radius:0 0 32px 32px;transition:background-color .5s ease}
.hero :focus-visible{outline-color:#fff}
.glyph{position:absolute;right:-30px;bottom:-70px;font:700 240px/1 var(--display);opacity:.1;pointer-events:none;user-select:none}
.hero-in{position:relative;max-width:520px;margin:0 auto}
.mnav{display:flex;align-items:center;justify-content:space-between}
.mnav button{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff}
.mnav button:active{background:rgba(255,255,255,.3)}
.mlabel{font-weight:600;font-size:16px}
.bl{margin-top:28px;font-size:14px}
.bal{font-family:var(--display);font-weight:600;line-height:1.15;letter-spacing:-.02em;margin:6px 0 24px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bal .cur{font-size:.55em;margin-left:.18em}
.flow{display:flex;gap:32px}
.flow small{display:block;font-size:13px}
.flow b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---- Секции ---- */
.block{max-width:520px;margin:0 auto;padding:28px 20px 0}
h2{margin:0 0 14px;font-size:18px;font-weight:600}
.bar{display:flex;gap:3px;height:16px}
.bar i{display:block;min-width:6px;border-radius:6px}
.legend{list-style:none;margin:14px 0 0;padding:0}
.legend li{display:grid;grid-template-columns:12px 1fr auto 44px;align-items:center;gap:10px;padding:7px 0;font-size:15px}
.sw{width:12px;height:12px;border-radius:4px}
.lv{font-variant-numeric:tabular-nums}
.lp{text-align:right;color:var(--hint);font-size:14px}

.day{display:flex;justify-content:space-between;color:var(--hint);font-size:14px;margin:22px 4px 8px}
.grp{background:var(--surface);border-radius:22px;overflow:hidden}
.op{display:flex;width:100%;align-items:center;gap:14px;padding:12px 16px;border:0;background:transparent;text-align:left}
.op+.op{border-top:1px solid var(--line)}
.op:active{background:var(--field)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.m{flex:1;min-width:0;display:block}
.t{display:block;font-weight:500}
.n{display:block;color:var(--hint);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.inc{color:var(--green)}
.foot{color:var(--hint);font-size:13px;text-align:center;margin:18px 0 0}
.empty{text-align:center;padding:36px 12px 0}
.empty p{margin:0}
.empty .sub{color:var(--hint);margin-top:6px}

/* ---- Кнопка добавления ---- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:28px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 62%,transparent);pointer-events:none}
.dock>*{pointer-events:auto;max-width:520px;margin-left:auto;margin-right:auto}
.pv{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pv[hidden]{display:none}
.pc{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:12px;padding:7px 11px;background:var(--surface);box-shadow:0 1px 4px rgba(10,12,20,.14);font-weight:500;font-size:14px}
.pc.warn{color:var(--hint)}
.qbar{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:30px;padding:6px;box-shadow:0 10px 30px rgba(10,12,20,.2)}
.qbar input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:10px 6px;font-size:16px}
.qbar input::placeholder{color:var(--hint)}
.plus,.go{width:44px;height:44px;border:0;border-radius:50%;display:grid;place-items:center;flex:none}
.plus{background:var(--field)}
.go{background:var(--pos);color:#fff}
.go:disabled{opacity:.35;cursor:default}

/* ---- Форма добавления ---- */
.sheet-bg{position:fixed;inset:0;background:rgba(8,10,16,.5);display:flex;align-items:flex-end;z-index:10;visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s}
.sheet-bg.open{visibility:visible;opacity:1}
.sheet{width:100%;max-width:520px;margin:0 auto;background:var(--surface);border-radius:28px 28px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet-bg.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--field);border-radius:14px}
.seg button{height:44px;border:0;border-radius:11px;background:transparent;color:var(--hint);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amount{position:relative;margin:20px 0 14px}
.amount input{width:100%;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;padding:6px 44px 8px 0;font:600 40px/1.2 var(--display);outline:none}
.amount input:focus{border-bottom-color:var(--ink)}
.amount input::placeholder{color:var(--line)}
.amount.inc input{color:var(--green)}
.rub{position:absolute;right:0;bottom:12px;font:600 26px var(--display);color:var(--hint)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:9px 13px;background:var(--field);font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fields{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-bottom:16px}
.fields input{min-width:0;width:100%;border:0;border-radius:14px;background:var(--field);padding:13px 14px;outline:none}
.save{width:100%;height:54px;border:0;border-radius:16px;background:var(--pos);color:#fff;font-weight:600;font-size:17px}
.save:disabled{opacity:.4;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="hero" id="hero">
  <div class="glyph" aria-hidden="true">₽</div>
  <div class="hero-in">
    <div class="mnav">
      <button id="prev" aria-label="Предыдущий месяц"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="mlabel" id="mlabel" aria-live="polite"></div>
      <button id="next" aria-label="Следующий месяц"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="bl">Баланс месяца</div>
    <div class="bal" id="bal"><span id="balNum">0</span><span class="cur">₽</span></div>
    <div class="flow">
      <div><small>Доходы</small><b id="inc">+0&nbsp;₽</b></div>
      <div><small>Расходы</small><b id="exp">−0&nbsp;₽</b></div>
    </div>
  </div>
</header>

<main>
  <section class="block" id="stats" hidden></section>
  <section class="block" id="list"></section>
</main>

<div class="dock">
  <div class="pv" id="pv" hidden></div>
  <div class="qbar">
    <button class="plus" id="fab" aria-label="Открыть полную форму"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <input id="q" type="text" placeholder="Кофе 250 вчера" enterkeyhint="done" autocomplete="off" aria-label="Быстрый ввод операции">
    <button class="go" id="go" disabled aria-label="Добавить"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="sheet-bg" id="bg">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Новая операция">
    <div class="grab"></div>
    <div class="seg">
      <button id="tE" aria-pressed="true">Расход</button>
      <button id="tI" aria-pressed="false">Доход</button>
    </div>
    <div class="amount" id="amountBox">
      <input id="amount" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Сумма">
      <span class="rub">₽</span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="fields">
      <input id="date" type="date" aria-label="Дата">
      <input id="note" type="text" placeholder="Заметка" maxlength="60" aria-label="Заметка">
    </div>
    <button class="save" id="save" disabled>Добавить расход</button>
  </div>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
const inTg = !!(tg && tg.initData);
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

const CATS = {
  e: [['🛒','Продукты'],['🚌','Транспорт'],['🍔','Кафе'],['🏠','Жильё'],['🎮','Развлечения'],['👕','Одежда'],['💊','Здоровье'],['📚','Учёба'],['📦','Другое']],
  i: [['💼','Зарплата'],['🎓','Стипендия'],['💸','Подработка'],['🎁','Подарки'],['📦','Другое']]
};
const EC = { 'Продукты':'#F59F00','Транспорт':'#4DABF7','Кафе':'#FA5252','Жильё':'#7950F2','Развлечения':'#E64980','Одежда':'#15AABF','Здоровье':'#40C057','Учёба':'#5C7CFA','Другое':'#868E96' };
const POS = '#2B3BFF', NEG = '#D63518';

let tx = [];
let month = today().slice(0, 7);
let type = 'e';
let cat = null;
let heroColor = POS;

function today() { return new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const num = n => nf.format(Math.abs(n));
const rub = n => num(n) + ' ₽';
const signed = n => (n < 0 ? '−' : n > 0 ? '+' : '') + rub(n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (l, t) => l.filter(x => x.t === t).reduce((s, x) => s + x.a, 0);
const icon = (t, c) => (CATS[t].find(x => x[1] === c) || ['📦'])[0];
const colorOf = (t, c) => t === 'i' ? '#12B886' : (EC[c] || '#868E96');
const rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; };
const buzz = k => { try { tg && tg.HapticFeedback.notificationOccurred(k); } catch (e) {} };
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- Тема и цвета оболочки Telegram ----------
function paintChrome() {
  if (!inTg) return;
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  try { tg.setHeaderColor(heroColor); } catch (e) {}
  try { tg.setBackgroundColor(bg); } catch (e) {}
  try { tg.setBottomBarColor(bg); } catch (e) {}
}
function applyTheme() {
  const dark = inTg ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  paintChrome();
}
applyTheme();
if (inTg) { try { tg.onEvent('themeChanged', applyTheme); } catch (e) {} }
else { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); }

// ---------- Хранилище: Telegram CloudStorage (по месяцам, кусками) + зеркало в localStorage ----------
const cs = inTg && tg.CloudStorage;
const CH = 2500;
const csGet = keys => new Promise(r => cs.getItems(keys, (e, v) => r(e ? {} : v || {})));
const csSet = (k, v) => new Promise(r => cs.setItem(k, v, () => r()));
const csDel = keys => new Promise(r => keys.length ? cs.removeItems(keys, () => r()) : r());
let queue = Promise.resolve();

async function load() {
  let local = [];
  try { local = JSON.parse(localStorage.getItem('tx') || '[]'); } catch (e) {}
  if (!cs) { tx = local; return; }
  const { idx } = await csGet(['idx']);
  const months = idx ? JSON.parse(idx) : [];
  const out = [];
  for (const m of months) {
    const n = Number((await csGet(['n:' + m]))['n:' + m] || 0);
    const keys = Array.from({ length: n }, (_, k) => 'c:' + m + ':' + k);
    const got = await csGet(keys);
    try { out.push(...JSON.parse(keys.map(k => got[k] || '').join('') || '[]')); } catch (e) {}
  }
  tx = out.length || months.length ? out : local;
}

function persist(m) {
  try { localStorage.setItem('tx', JSON.stringify(tx)); } catch (e) {}
  if (!cs) return;
  queue = queue.then(async () => {
    const list = tx.filter(t => t.d.startsWith(m));
    const old = Number((await csGet(['n:' + m]))['n:' + m] || 0);
    const s = JSON.stringify(list);
    const parts = [];
    for (let i = 0; i < s.length; i += CH) parts.push(s.slice(i, i + CH));
    if (!list.length) parts.length = 0;
    for (let k = 0; k < parts.length; k++) await csSet('c:' + m + ':' + k, parts[k]);
    const extra = [];
    for (let k = parts.length; k < old; k++) extra.push('c:' + m + ':' + k);
    await csDel(extra);
    if (parts.length) await csSet('n:' + m, String(parts.length)); else await csDel(['n:' + m]);
    const months = [...new Set(tx.map(t => t.d.slice(0, 7)))];
    await csSet('idx', JSON.stringify(months));
  }).catch(() => {});
}

// ---------- Отрисовка ----------
function monthLabel() {
  const [y, m] = month.split('-').map(Number);
  const s = new Date(y, m - 1, 1).toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }).replace(' г.', '');
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function dayLabel(d) {
  if (d === today()) return 'Сегодня';
  const y = new Date(Date.now() - new Date().getTimezoneOffset() * 60000 - 864e5).toISOString().slice(0, 10);
  if (d === y) return 'Вчера';
  return new Date(d + 'T00:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });
}

// Баланс: число «докручивается» до нового значения при загрузке и смене месяца
let shown = 0, raf = 0;
function setBalance(target, animate) {
  cancelAnimationFrame(raf);
  const txt = (target < 0 ? '−' : '') + num(target);
  const L = txt.length;
  $('bal').style.fontSize = (L <= 6 ? 48 : L <= 8 ? 42 : L <= 10 ? 34 : L <= 12 ? 28 : 22) + 'px';
  if (!animate || reduceMotion() || shown === target) { $('balNum').textContent = txt; shown = target; return; }
  const from = shown, t0 = performance.now(), D = 600;
  const step = now => {
    const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
    const v = from + (target - from) * e;
    const val = p === 1 ? target : Math.round(v);
    $('balNum').textContent = (val < 0 ? '−' : '') + num(val);
    shown = p === 1 ? target : v;
    if (p < 1) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

function render(animate) {
  const list = tx.filter(t => t.d.startsWith(month)).sort((a, b) => b.d.localeCompare(a.d) || b.i - a.i);
  const inc = sum(list, 'i'), exp = sum(list, 'e'), bal = inc - exp;

  $('mlabel').textContent = monthLabel();
  $('inc').textContent = '+' + rub(inc);
  $('exp').textContent = '−' + rub(exp);
  heroColor = bal < 0 ? NEG : POS;
  document.documentElement.style.setProperty('--hero', heroColor);
  paintChrome();
  setBalance(bal, animate);

  // Куда ушли деньги
  const by = {};
  list.filter(x => x.t === 'e').forEach(x => by[x.c] = (by[x.c] || 0) + x.a);
  const rows = Object.entries(by).sort((a, b) => b[1] - a[1]);
  const st = $('stats');
  if (rows.length) {
    st.hidden = false;
    st.innerHTML = '<h2>Куда ушло</h2><div class="bar" role="img" aria-label="Расходы по категориям">' +
      rows.map(([c, v]) => '<i style="flex:' + v + ';background:' + colorOf('e', c) + '"></i>').join('') + '</div><ul class="legend">' +
      rows.map(([c, v]) => {
        const p = v / exp * 100;
        return '<li><span class="sw" style="background:' + colorOf('e', c) + '"></span><span>' + esc(c) + '</span><span class="lv">' + rub(v) + '</span><span class="lp">' + (p < 1 ? '<1' : Math.round(p)) + '%</span></li>';
      }).join('') + '</ul>';
  } else { st.hidden = true; st.innerHTML = ''; }

  // Операции по дням
  if (!list.length) {
    $('list').innerHTML = '<div class="empty"><p>В этом месяце пока ничего нет.</p><p class="sub">Напиши внизу, например: «кофе 250».</p></div>';
    return;
  }
  let html = '<h2>Операции</h2>';
  for (const d of [...new Set(list.map(x => x.d))]) {
    const items = list.filter(x => x.d === d);
    const net = sum(items, 'i') - sum(items, 'e');
    html += '<div class="day"><span>' + dayLabel(d) + '</span><span>' + (net ? signed(net) : '') + '</span></div><div class="grp">';
    for (const x of items) {
      const c = colorOf(x.t, x.c);
      html += '<button class="op" data-id="' + x.i + '"><span class="ic" style="background:' + rgba(c, .16) + '">' + icon(x.t, x.c) + '</span>' +
        '<span class="m"><span class="t">' + esc(x.c) + '</span>' + (x.n ? '<span class="n">' + esc(x.n) + '</span>' : '') + '</span>' +
        '<span class="amt' + (x.t === 'i' ? ' inc' : '') + '">' + (x.t === 'i' ? '+' : '−') + rub(x.a) + '</span></button>';
    }
    html += '</div>';
  }
  $('list').innerHTML = html + '<p class="foot">Нажми на операцию, чтобы удалить.</p>';
}

// ---------- Форма ----------
function renderChips() {
  $('chips').innerHTML = CATS[type].map(([e, n]) => '<button class="chip" aria-pressed="' + (cat === n) + '" data-c="' + n + '">' + e + ' ' + n + '</button>').join('');
  check();
}
function parseAmount() { return parseFloat($('amount').value.replace(/\s/g, '').replace(',', '.')); }
function check() { const a = parseAmount(); $('save').disabled = !(a > 0) || !cat; }
function setType(t) {
  type = t; cat = null;
  $('tE').setAttribute('aria-pressed', t === 'e'); $('tI').setAttribute('aria-pressed', t === 'i');
  $('amountBox').classList.toggle('inc', t === 'i');
  $('save').textContent = t === 'e' ? 'Добавить расход' : 'Добавить доход';
  renderChips();
}
function openSheet() {
  $('q').blur();
  $('amount').value = ''; $('note').value = ''; $('date').value = today();
  setType('e');
  $('bg').classList.add('open');
  setTimeout(() => $('amount').focus(), 260);
}
function closeSheet() { $('bg').classList.remove('open'); }
let tt;
function toast(m) { const el = $('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 1600); }

$('fab').onclick = openSheet;
$('bg').onclick = e => { if (e.target === $('bg')) closeSheet(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('tE').onclick = () => setType('e');
$('tI').onclick = () => setType('i');
$('amount').oninput = check;
$('chips').onclick = e => { const b = e.target.closest('.chip'); if (b) { cat = b.dataset.c; renderChips(); } };
$('save').onclick = () => {
  const a = Math.round(parseAmount() * 100) / 100;
  if (!(a > 0) || !cat) return;
  const d = $('date').value || today();
  tx.push({ i: Date.now(), t: type, a, c: cat, d, n: $('note').value.trim() });
  month = d.slice(0, 7);
  persist(month);
  buzz('success'); closeSheet(); render(true); toast('Добавлено');
};
$('prev').onclick = () => shift(-1);
$('next').onclick = () => shift(1);
function shift(k) {
  const [y, m] = month.split('-').map(Number);
  const d = new Date(y, m - 1 + k, 1);
  month = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  render(true);
}

// Удаление по нажатию на операцию
$('list').onclick = e => {
  const el = e.target.closest('.op'); if (!el) return;
  const id = Number(el.dataset.id);
  const x = tx.find(t => t.i === id); if (!x) return;
  const del = ok => {
    if (!ok) return;
    tx = tx.filter(t => t.i !== id);
    persist(x.d.slice(0, 7)); buzz('warning'); render(true); toast('Удалено');
  };
  const msg = 'Удалить операцию «' + x.c + '» на ' + rub(x.a) + '?';
  if (inTg && tg.showConfirm) tg.showConfirm(msg, del); else del(confirm(msg));
};

// ---------- Быстрый ввод одной строкой ----------
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
// Слово совпадает по началу; «=» на конце значит точное слово
const KW = {
  e: [
    ['Продукты', ['продукт','магнит','пятероч','перекрест','лента=','ашан','хлеб','молок','вкусвилл','дикси','самокат','магазин','овощ','фрукт','мяс']],
    ['Транспорт', ['транспорт','такси','метро','автобус','проезд','бензин','маршрутк','электричк','заправк','тройк','трамва','каршеринг','парковк']],
    ['Кафе', ['кофе','кафе','обед','ужин','завтрак','бургер','пицц','шаурм','макдон','мак=','kfc','кфс','ресторан','столов','перекус','доставк','суши','ролл','чай','вкусно']],
    ['Жильё', ['жиль','аренд','квартир','жкх','коммунал','свет=','интернет','общаг','общежит','комнат']],
    ['Развлечения', ['развлеч','кино','игр','steam','стим','подписк','netflix','бар=','клуб','концерт','боулинг','spotify','youtube','ютуб','пив']],
    ['Одежда', ['одежд','футболк','кроссовк','куртк','джинс','кепк','обув','худи','штан']],
    ['Здоровье', ['здоров','аптек','лекарств','врач','стоматолог','зуб','таблетк','анализ','больниц']],
    ['Учёба', ['учеб','книг','курс','печат','ксерокс','канцеляр','универ','лекци','тетрад']]
  ],
  i: [
    ['Зарплата', ['зарплат','аванс','зп=']],
    ['Стипендия', ['стипенд']],
    ['Подработка', ['подработ','смен','склад','халтур']],
    ['Подарки', ['подарил']]
  ]
};
const INCOME_TRIGGERS = ['получил','пришло=','пришли=','перевели'];
const norm = s => s.toLowerCase().replace(/ё/g, 'е');
const pad2 = n => String(n).padStart(2, '0');
function addDays(ds, n) { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function validDate(y, m, d) { const x = new Date(y, m - 1, d); return x.getFullYear() === y && x.getMonth() === m - 1 && x.getDate() === d; }
const hit = (words, kw) => kw.endsWith('=') ? words.includes(kw.slice(0, -1)) : words.some(w => w.startsWith(kw));

// «Кофе 250 вчера», «+18 500 смена», «такси 1,5к 12.10» -> { a, t, c, d, n }
function parse(raw) {
  let s = raw.trim();
  let t = /^\+/.test(s) ? 'i' : 'e';
  s = s.replace(/^\+\s*/, '');
  const T = today(), Y = Number(T.slice(0, 4));
  let d = T;
  const take = (re, ok) => { const m = s.match(re); if (m && (!ok || ok(m))) { s = s.replace(re, ' '); return m; } return null; };

  let m;
  if (take(/(^|\s)позавчера(?=\s|$)/i)) d = addDays(T, -2);
  else if (take(/(^|\s)вчера(?=\s|$)/i)) d = addDays(T, -1);
  else if (take(/(^|\s)сегодня(?=\s|$)/i)) d = T;
  else if ((m = take(/(^|\s)(\d{1,2})\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)(?=\s|$)/i,
      x => validDate(Y, MONTHS.indexOf(x[3].toLowerCase()) + 1, Number(x[2]))))) {
    d = Y + '-' + pad2(MONTHS.indexOf(m[3].toLowerCase()) + 1) + '-' + pad2(Number(m[2]));
  } else if ((m = take(/(^|\s)(\d{1,2})[./](\d{2})(?:[./](\d{4}|\d{2}))?(?=\s|$)/,
      x => validDate(x[4] ? (x[4].length === 2 ? 2000 + Number(x[4]) : Number(x[4])) : Y, Number(x[3]), Number(x[2]))))) {
    const yy = m[4] ? (m[4].length === 2 ? 2000 + Number(m[4]) : Number(m[4])) : Y;
    d = yy + '-' + m[3] + '-' + pad2(Number(m[2]));
  }

  s = s.replace(/(\d)\s*(?:₽|руб(?:лей|ля)?\.?|р\.?)(?![а-яёa-z])/gi, '$1 ');
  let a = 0;
  const am = s.match(/(\d{1,3}(?:[ \u00A0]\d{3})+|\d+)(?:[.,](\d{1,2}))?\s*(тыс\.?|к|k)?(?![а-яёa-z\d])/i);
  if (am) {
    a = parseFloat(am[1].replace(/[ \u00A0]/g, '') + (am[2] ? '.' + am[2] : ''));
    if (am[3]) a *= 1000;
    a = Math.round(a * 100) / 100;
    s = s.replace(am[0], ' ');
  }

  const words = norm(s).split(/[^a-zа-я0-9]+/).filter(Boolean);
  if (t === 'e' && (KW.i.some(([, kws]) => kws.some(k => hit(words, k))) || INCOME_TRIGGERS.some(k => hit(words, k)))) t = 'i';
  let c = 'Другое';
  for (const [name, kws] of KW[t]) if (kws.some(k => hit(words, k))) { c = name; break; }

  let n = s.replace(/#/g, '').replace(/\s+/g, ' ').trim();
  if (norm(n) === norm(c)) n = '';
  n = (n.charAt(0).toUpperCase() + n.slice(1)).slice(0, 60);
  return { a, t, c, d, n };
}

let qt = null, qc = null; // ручные правки типа и категории
function quickState() {
  const raw = $('q').value;
  if (!raw.trim()) return null;
  const p = parse(raw);
  const t = qt || p.t;
  const c = qc && CATS[t].some(x => x[1] === qc) ? qc : (t === p.t ? p.c : 'Другое');
  return { ...p, t, c };
}
function renderQuick() {
  const q = quickState(), pv = $('pv');
  $('go').disabled = !(q && q.a > 0);
  if (!q) { pv.hidden = true; pv.innerHTML = ''; return; }
  pv.hidden = false;
  pv.innerHTML =
    '<button class="pc" data-k="t">' + (q.t === 'e' ? '− Расход' : '+ Доход') + '</button>' +
    '<button class="pc" data-k="c">' + icon(q.t, q.c) + ' ' + esc(q.c) + '</button>' +
    (q.a > 0 ? '<span class="pc">' + rub(q.a) + '</span>' : '<span class="pc warn">Добавь сумму</span>') +
    (q.d !== today() ? '<span class="pc">' + dayLabel(q.d) + '</span>' : '');
}
function quickSubmit() {
  const q = quickState();
  if (!q || !(q.a > 0)) return;
  tx.push({ i: Date.now(), t: q.t, a: q.a, c: q.c, d: q.d, n: q.n });
  month = q.d.slice(0, 7);
  persist(month);
  $('q').value = ''; qt = qc = null; renderQuick(); $('q').blur();
  buzz('success'); render(true); toast('Добавлено');
}
$('q').addEventListener('input', () => { if (!$('q').value.trim()) qt = qc = null; renderQuick(); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); quickSubmit(); } });
$('go').onclick = quickSubmit;
// Нажатие на плашку меняет тип или переключает категорию по кругу
$('pv').onclick = e => {
  const b = e.target.closest('.pc'); if (!b || !b.dataset.k) return;
  const q = quickState(); if (!q) return;
  if (b.dataset.k === 't') { qt = q.t === 'e' ? 'i' : 'e'; qc = null; }
  else { const list = CATS[q.t], i = list.findIndex(x => x[1] === q.c); qc = list[(i + 1) % list.length][1]; }
  renderQuick();
};

load().then(() => render(true));
</script>
