<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Мои финансы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#EDEFF8; --ink:#12142A; --hint:#575E7D; --line:rgba(18,20,42,.09);
  --glass:rgba(255,255,255,.58); --glass-hi:rgba(255,255,255,.8); --sheet:rgba(255,255,255,.84); --stroke:rgba(255,255,255,.8);
  --field:rgba(18,20,42,.06); --seg-on:rgba(255,255,255,.92);
  --shadow:0 10px 40px rgba(50,60,140,.12);
  --pos:#6C4DFF; --grad:linear-gradient(135deg,#4F6BFF 0%,#7A55FF 55%,#A862FF 100%); --glow:0 8px 24px rgba(122,86,255,.32); --green:#0B8F66; --warn:#D63518;
  --o1:#4B5CFF; --o2:#9A6BFF; --o3:#3CC8FF; --oa:.5;
  --display:'Unbounded','Golos Text',system-ui,sans-serif;
  --body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#090A13; --ink:#F1F3FF; --hint:#A4AAC8; --line:rgba(255,255,255,.09);
  --glass:rgba(255,255,255,.07); --glass-hi:rgba(255,255,255,.13); --sheet:rgba(22,24,42,.84); --stroke:rgba(255,255,255,.14);
  --field:rgba(255,255,255,.08); --seg-on:rgba(255,255,255,.16);
  --shadow:0 10px 40px rgba(0,0,0,.45);
  --green:#3DDC9A; --warn:#FF8A70; --oa:.4;
  color-scheme:dark;
}
:root[data-neg="1"]{--o1:#FF6A4D;--o2:#FF4F8B;--o3:#FFB04A}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:rgba(255,255,255,.92);--sheet:rgba(255,255,255,.97)}
  :root[data-theme="dark"]{--glass:rgba(34,36,58,.94);--sheet:rgba(24,26,44,.98)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding-bottom:calc(150px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #8FA0FF;outline-offset:2px}

/* Фон: мягкие цветные пятна. При минусе меняют оттенок на тёплый */
.orbs{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.orbs{opacity:var(--oa);background:radial-gradient(circle 280px at 0% 4%,var(--o1),transparent 72%),radial-gradient(circle 260px at 100% 30%,var(--o2),transparent 72%),radial-gradient(circle 300px at 35% 100%,var(--o3),transparent 72%)}
.orbs i{display:none}
.orbs i:nth-child(1){width:300px;height:300px;left:-90px;top:-70px;background:var(--o1)}
.orbs i:nth-child(2){width:260px;height:260px;right:-110px;top:170px;background:var(--o2)}
.orbs i:nth-child(3){width:290px;height:290px;left:15%;bottom:-130px;background:var(--o3)}

/* Стеклянные панели */
.hero,.tcard,.sbox,.grp,.qbar,.pc{background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.qbar{-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4)}

/* ---- Шапка с балансом ---- */
.hero{position:relative;overflow:hidden;width:calc(100% - 32px);max-width:520px;margin:14px auto 0;padding:16px 18px 24px;border-radius:32px}
.glyph{position:absolute;right:-30px;bottom:-70px;font:700 240px/1 var(--display);color:var(--ink);opacity:.05;pointer-events:none;user-select:none}
.hero-in{position:relative}
.mnav{display:flex;align-items:center;justify-content:space-between}
.mnav button{width:40px;height:40px;border:1px solid var(--stroke);border-radius:50%;background:var(--field);display:grid;place-items:center;color:var(--ink)}
.mnav button:active{background:var(--glass-hi)}
.mlabel{font-weight:600;font-size:16px}
.bl{margin-top:26px;font-size:14px;color:var(--hint)}
.bal{font-family:var(--display);font-weight:600;line-height:1.15;letter-spacing:-.02em;margin:6px 0 22px;font-variant-numeric:tabular-nums;white-space:nowrap;transition:color .4s}
:root[data-neg="1"] .bal{color:var(--warn)}
.bal .cur{font-size:.55em;margin-left:.18em;color:var(--hint)}
.flow{display:flex;gap:32px}
.flow small{display:block;font-size:13px;color:var(--hint)}
.flow b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
#inc{color:var(--green)}

/* ---- Секции ---- */
.block{max-width:520px;margin:0 auto;padding:22px 16px 0}
h2{margin:0 0 12px 4px;font-size:18px;font-weight:600}
.tcard{display:flex;align-items:center;justify-content:space-between;gap:14px;border-radius:24px;padding:18px}
.tl{color:var(--hint);font-size:14px}
.tv{font:600 32px/1.2 var(--display);margin:4px 0 6px;font-variant-numeric:tabular-nums}
.tv.low{color:var(--warn)}
.ts{color:var(--hint);font-size:13px}
.tbtn{flex:none;border:1px solid var(--stroke);border-radius:14px;padding:10px 14px;background:var(--field);font-weight:600;font-size:14px}
.sbox{border-radius:24px;padding:18px 18px 10px}
.bar{display:flex;gap:3px;height:16px}
.bar i{display:block;min-width:6px;border-radius:6px}
.legend{list-style:none;margin:14px 0 0;padding:0}
.legend li{display:grid;grid-template-columns:12px 1fr auto 44px;align-items:center;gap:10px;padding:7px 0;font-size:15px}
.sw{width:12px;height:12px;border-radius:4px}
.lv{font-variant-numeric:tabular-nums}
.lp{text-align:right;color:var(--hint);font-size:14px}

.day{display:flex;justify-content:space-between;color:var(--hint);font-size:14px;margin:22px 6px 8px}
.grp{border-radius:24px;overflow:hidden}
.op{display:flex;width:100%;align-items:center;gap:14px;padding:12px 16px;border:0;background:transparent;text-align:left}
.op+.op{border-top:1px solid var(--line)}
.op:active{background:var(--field)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.m{flex:1;min-width:0;display:block}
.t{display:block;font-weight:500}
.n{display:block;color:var(--hint);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.inc{color:var(--green)}
.foot{color:var(--hint);font-size:13px;text-align:center;margin:18px 0 0}
.empty{text-align:center;padding:36px 12px 0}
.empty p{margin:0}
.empty .sub{color:var(--hint);margin-top:6px}

/* ---- Нижняя панель быстрого ввода ---- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:28px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 38%,transparent);pointer-events:none}
.dock>*{pointer-events:auto;max-width:520px;margin-left:auto;margin-right:auto}
.pv{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pv[hidden]{display:none}
.pc{display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:7px 11px;font-weight:500;font-size:14px;box-shadow:0 2px 10px rgba(50,60,140,.1)}
.pc.warn{color:var(--hint)}
.qbar{display:flex;align-items:center;gap:8px;border-radius:30px;padding:6px}
.qbar input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:10px 6px;font-size:16px}
.qbar input::placeholder{color:var(--hint)}
.plus,.go{width:44px;height:44px;border:0;border-radius:50%;display:grid;place-items:center;flex:none}
.plus{background:var(--field)}
.go{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.go:disabled{opacity:.35;cursor:default}

/* ---- Окна снизу ---- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,30,.32);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;z-index:10;visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s}
.sheet-bg.open{visibility:visible;opacity:1}
.sheet{width:100%;max-width:520px;margin:0 auto;background:var(--sheet);border:1px solid var(--stroke);border-bottom:0;-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border-radius:28px 28px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet-bg.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--field);border-radius:14px}
.seg button{height:44px;border:0;border-radius:11px;background:transparent;color:var(--hint);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(20,24,60,.14)}
.amount{position:relative;margin:20px 0 14px}
.amount input{width:100%;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;padding:6px 44px 8px 0;font:600 40px/1.2 var(--display);outline:none}
.amount input:focus{border-bottom-color:var(--ink)}
.amount input::placeholder{color:var(--line)}
.amount.inc input{color:var(--green)}
.rub{position:absolute;right:0;bottom:12px;font:600 26px var(--display);color:var(--hint)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:9px 13px;background:var(--field);font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fields{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-bottom:16px}
.fields input,.fi{min-width:0;width:100%;border:0;border-radius:14px;background:var(--field);padding:13px 14px;outline:none}
.save{width:100%;height:54px;border:0;border-radius:16px;background:var(--grad);color:#fff;font-weight:600;font-size:17px;box-shadow:var(--glow)}
.save:disabled{opacity:.4;cursor:default}
.sh{margin:0 0 4px}
.fl{display:block;margin:16px 0 6px;font-weight:600;font-size:14px}
.payadd{display:grid;grid-template-columns:1.6fr 1fr .7fr;gap:8px;margin-top:8px}
.payadd .chip{grid-column:1/-1;justify-content:center}
.pay{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pay span:first-child{flex:1;font-weight:500}
.pm{color:var(--hint);font-size:14px}
.pay button{border:0;background:transparent;color:var(--hint);padding:6px}
.hintp{color:var(--hint);font-size:13px;margin:10px 0 14px}

.toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.blrow{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.blrow .bl{margin:0}
.menu{width:40px;height:40px;border:1px solid var(--stroke);border-radius:50%;background:var(--field);display:grid;place-items:center;color:var(--ink)}
.menu:active{background:var(--glass-hi)}
.dr-bg{position:fixed;inset:0;background:rgba(10,12,30,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:20;visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s}
.dr-bg.open{visibility:visible;opacity:1}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(84vw,330px);background:var(--sheet);border-right:1px solid var(--stroke);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);padding:calc(22px + env(safe-area-inset-top)) 0 calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);overflow:auto}
.dr-bg.open .drawer{transform:none}
.dr-head{padding:0 20px 18px;border-bottom:1px solid var(--line);margin-bottom:8px}
.dr-head small{display:block;color:var(--hint);font-size:13px}
.dr-head b{display:block;font-family:var(--display);font-size:24px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.dr-item{display:flex;align-items:center;gap:16px;width:100%;border:0;background:transparent;color:var(--ink);padding:14px 20px;font-size:17px;font-weight:500;text-align:left}
.dr-item:active{background:var(--field)}
.dr-item svg{flex:none;opacity:.8}
.dr-foot{margin-top:auto;padding:14px 20px 0;color:var(--hint);font-size:13px}
.mrow{display:grid;grid-template-columns:5.2rem 1fr;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mrow:first-child{border-top:0}
.mrow .bars{display:grid;gap:4px}
.mrow .bars i{display:block;height:8px;border-radius:4px;min-width:2px}
.mrow .vals{grid-column:2;color:var(--hint);font-size:12px;font-variant-numeric:tabular-nums}
.days{display:flex;align-items:flex-end;gap:2px;height:120px;margin:8px 0 4px}
.days i{flex:1;min-width:2px;border-radius:3px 3px 0 0;background:var(--pos);opacity:.85}
.crow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow button{border:0;background:var(--field);color:var(--warn);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.cadd{display:grid;grid-template-columns:3.6rem 1fr;gap:10px;margin-top:8px}

.lb{grid-column:2/-1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--hint);margin-top:-2px}
.lb .tr{flex:1;height:6px;border-radius:3px;background:var(--field);overflow:hidden}
.lb .tr i{display:block;height:100%;border-radius:3px;background:var(--green)}
.lb.warn .tr i{background:#F59F00}.lb.over{color:var(--warn)}.lb.over .tr i{background:var(--warn)}
.crow .lim{width:6.2rem;padding:8px 10px;margin-right:8px;text-align:right;font-size:14px}
.crow .cr{display:flex;align-items:center}
.save.del{background:transparent;color:var(--warn);margin-top:8px;box-shadow:none;border:1px solid var(--line)}
.debt{padding:12px 0;border-top:1px solid var(--line)}
.debt:first-child{border-top:0}
.debt .dh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.debt .dh button{border:0;background:var(--field);color:var(--warn);width:30px;height:30px;border-radius:50%;font-size:17px;line-height:1;flex:none}
.debt .dm{color:var(--hint);font-size:13px;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.debt .tr{height:8px;border-radius:4px;background:var(--field);overflow:hidden}
.debt .tr i{display:block;height:100%;border-radius:4px;background:var(--green)}
.debt .pay{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.debt .pay .fi{padding:10px 12px}
.debt .pay button{border:0;border-radius:14px;background:var(--grad);color:#fff;font-weight:600;padding:0 16px}
.dadd{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.dadd .fi:first-child{grid-column:1/-1}

.onb{position:fixed;inset:0;z-index:40;background:rgba(9,10,19,.25);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));overflow:auto}
.onb[hidden]{display:none}
:root:not([data-theme="dark"]) .onb{background:rgba(237,239,248,.3)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.onb{background:var(--bg)}}
.onb-card{width:100%;max-width:440px;background:var(--glass);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);box-shadow:var(--shadow);border-radius:32px;padding:28px 22px 22px}
.onb-ic{width:64px;height:64px;border-radius:20px;background:var(--grad);box-shadow:var(--glow);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:30px;font-weight:600;margin-bottom:18px}
.onb h1{font-family:var(--display);font-size:24px;line-height:1.2;margin:0 0 12px;font-weight:600}
.onb p{color:var(--hint);margin:0 0 10px;line-height:1.45}
.onb ul{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:12px}
.onb li{display:flex;gap:12px;line-height:1.4}
.onb li b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--field);display:grid;place-items:center;font-size:14px}
.onb .dots{display:flex;gap:6px;justify-content:center;margin:16px 0 0}
.onb .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.onb .dots i.on{background:var(--pos);width:20px;border-radius:4px}
.onb .lnk{display:block;width:100%;border:0;background:transparent;color:var(--hint);font-size:14px;padding:14px 0 0;text-align:center}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="hero" id="hero">
  <div class="glyph" id="glyph" aria-hidden="true">₽</div>
  <div class="hero-in">
    <div class="mnav">
      <button id="prev" aria-label="Предыдущий месяц"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="mlabel" id="mlabel" aria-live="polite"></div>
      <button id="next" aria-label="Следующий месяц"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="blrow"><div class="bl">Баланс месяца</div><button class="menu" id="menu" aria-label="Меню"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button></div>
    <div class="bal" id="bal"><span id="balNum">0</span><span class="cur" id="cur">₽</span></div>
    <div class="flow">
      <div><small>Доходы</small><b id="inc">+0&nbsp;₽</b></div>
      <div><small>Расходы</small><b id="exp">−0&nbsp;₽</b></div>
    </div>
  </div>
</header>

<main>
  <section class="block" id="today" hidden></section>
  <section class="block" id="stats" hidden></section>
  <section class="block" id="list"></section>
</main>

<div class="dock">
  <div class="pv" id="pv" hidden></div>
  <div class="qbar">
    <button class="plus" id="fab" aria-label="Открыть полную форму"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <input id="q" type="text" placeholder="Кофе 250 вчера" enterkeyhint="done" autocomplete="off" aria-label="Быстрый ввод операции">
    <button class="go" id="go" disabled aria-label="Добавить"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  </div>
</div>
<div class="onb" id="onb" hidden role="dialog" aria-modal="true" aria-label="Знакомство"><div class="onb-card" id="onbCard"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="sheet-bg" id="bg">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Новая операция">
    <div class="grab"></div>
    <div class="seg">
      <button id="tE" aria-pressed="true">Расход</button>
      <button id="tI" aria-pressed="false">Доход</button>
    </div>
    <div class="amount" id="amountBox">
      <input id="amount" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Сумма">
      <span class="rub" id="rubSym">₽</span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="fields">
      <input id="date" type="date" aria-label="Дата">
      <input id="note" type="text" placeholder="Заметка" maxlength="60" aria-label="Заметка">
    </div>
    <button class="save" id="save" disabled>Добавить расход</button>
    <button class="save del" id="delBtn" type="button" hidden>Удалить операцию</button>
  </div>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
const inTg = !!(tg && tg.initData);
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

const CATS = {
  e: [['🛒','Продукты'],['🚌','Транспорт'],['🍔','Кафе'],['🏠','Жильё'],['🎮','Развлечения'],['👕','Одежда'],['💊','Здоровье'],['📚','Учёба'],['📦','Другое']],
  i: [['💼','Зарплата'],['🎓','Стипендия'],['💸','Подработка'],['🎁','Подарки'],['📦','Другое']]
};
const EC = { 'Продукты':'#F59F00','Транспорт':'#4DABF7','Кафе':'#FA5252','Жильё':'#7950F2','Развлечения':'#E64980','Одежда':'#15AABF','Здоровье':'#40C057','Учёба':'#5C7CFA','Другое':'#868E96' };
const POS = '#6C4DFF', NEG = '#D63518';

let tx = [];
let month = today().slice(0, 7);
let type = 'e';
let cat = null;
let heroColor = POS;
let cfg = { cur: '₽', start: 0, days: [], reserve: 0, pays: [], set: false, cats: { e: [], i: [] }, limits: {}, debts: [] };
cfg.cur = defaultCur();

function today() { return new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const num = n => nf.format(Math.abs(n));
const rub = n => num(n) + '\u00A0' + cfg.cur;
const signed = n => (n < 0 ? '−' : n > 0 ? '+' : '') + rub(n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (l, t) => l.filter(x => x.t === t).reduce((s, x) => s + x.a, 0);
const icon = (t, c) => (CATS[t].find(x => x[1] === c) || ['📦'])[0];
const PAL = ['#FF8787','#69DB7C','#74C0FC','#B197FC','#FFD43B','#63E6BE','#F783AC','#A9E34B','#4DABF7','#FFA94D','#E599F7','#3BC9DB'];
const colorOf = (t, c) => {
  if (t === 'i') return '#12B886';
  if (EC[c]) return EC[c];
  let h = 0; for (const ch of c) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return PAL[h % PAL.length];
};
function applyCats() {
  for (const t of ['e', 'i']) for (const [e, n] of ((cfg.cats && cfg.cats[t]) || []))
    if (!CATS[t].some(x => x[1] === n)) CATS[t].splice(Math.max(0, CATS[t].length - 1), 0, [e, n]);
}
const rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; };
const buzz = k => { try { tg && tg.HapticFeedback.notificationOccurred(k); } catch (e) {} };
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- Тема и цвета оболочки Telegram ----------
function paintChrome() {
  if (!inTg) return;
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  try { tg.setHeaderColor(bg); } catch (e) {}
  try { tg.setBackgroundColor(bg); } catch (e) {}
  try { tg.setBottomBarColor(bg); } catch (e) {}
}
function applyTheme() {
  const dark = inTg ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  paintChrome();
}
applyTheme();
if (inTg) { try { tg.onEvent('themeChanged', applyTheme); } catch (e) {} }
else { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); }

// ---------- Хранилище: Telegram CloudStorage (по месяцам, кусками) + зеркало в localStorage ----------
const cs = inTg && tg.CloudStorage;
const CH = 1000; // с запасом: лимит 4096, кириллица может считаться по 2 байта
let cloudErr = '';
const csGet = keys => new Promise(r => cs.getItems(keys, (e, v) => { if (e) cloudErr = String(e).slice(0, 60); r(e ? {} : v || {}); }));
const csSet = (k, v) => new Promise(r => cs.setItem(k, v, (e, ok) => { if (e || ok === false) cloudErr = String(e || 'не сохранено').slice(0, 60); r(); }));
const csDel = keys => new Promise(r => keys.length ? cs.removeItems(keys, e => { if (e) cloudErr = String(e).slice(0, 60); r(); }) : r());
const cloudStatus = () => !cs ? 'Сохранение только на этом устройстве' : cloudErr ? 'Облако Telegram: ошибка ' + cloudErr : 'Данные сохраняются в облаке Telegram';
function afterSync(msg) { if (cs) queue.then(() => toast(cloudErr ? 'Не сохранилось в облаке: ' + cloudErr : msg)); }
let queue = Promise.resolve();

let needSync = false;
async function load() {
  let local = [];
  try { local = JSON.parse(localStorage.getItem('tx') || '[]'); } catch (e) {}
  try { Object.assign(cfg, JSON.parse(localStorage.getItem('cfg') || '{}')); } catch (e) {}
  if (!cs) { tx = local; return; }
  const { idx, cfg: rawCfg } = await csGet(['idx', 'cfg']);
  try { if (rawCfg) Object.assign(cfg, JSON.parse(rawCfg)); } catch (e) {}
  const months = idx ? JSON.parse(idx) : [];
  const out = [];
  for (const m of months) {
    const n = Number((await csGet(['n_' + m]))['n_' + m] || 0);
    const keys = Array.from({ length: n }, (_, k) => 'c_' + m + '_' + k);
    const got = await csGet(keys);
    try { out.push(...JSON.parse(keys.map(k => got[k] || '').join('') || '[]')); } catch (e) {}
  }
  tx = out.length || months.length ? out : local;
  // Данные, что остались только на устройстве, переносим в облако Telegram
  if (!out.length && !months.length && local.length) { needSync = true; }
}

function persist(m) {
  try { localStorage.setItem('tx', JSON.stringify(tx)); } catch (e) {}
  if (!cs) return;
  queue = queue.then(async () => {
    cloudErr = '';
    const list = tx.filter(t => t.d.startsWith(m));
    const old = Number((await csGet(['n_' + m]))['n_' + m] || 0);
    const s = JSON.stringify(list);
    const parts = [];
    for (let i = 0; i < s.length; i += CH) parts.push(s.slice(i, i + CH));
    if (!list.length) parts.length = 0;
    for (let k = 0; k < parts.length; k++) await csSet('c_' + m + '_' + k, parts[k]);
    const extra = [];
    for (let k = parts.length; k < old; k++) extra.push('c_' + m + '_' + k);
    await csDel(extra);
    if (parts.length) await csSet('n_' + m, String(parts.length)); else await csDel(['n_' + m]);
    const months = [...new Set(tx.map(t => t.d.slice(0, 7)))];
    await csSet('idx', JSON.stringify(months));
  }).catch(e => { cloudErr = String((e && e.message) || e).slice(0, 60); });
}

// ---------- Отрисовка ----------
function monthLabel() {
  const [y, m] = month.split('-').map(Number);
  const s = new Date(y, m - 1, 1).toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }).replace(' г.', '');
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function dayLabel(d) {
  if (d === today()) return 'Сегодня';
  const y = new Date(Date.now() - new Date().getTimezoneOffset() * 60000 - 864e5).toISOString().slice(0, 10);
  if (d === y) return 'Вчера';
  return new Date(d + 'T00:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });
}

// Баланс: число «докручивается» до нового значения при загрузке и смене месяца
let shown = 0, raf = 0;
function setBalance(target, animate) {
  cancelAnimationFrame(raf);
  const txt = (target < 0 ? '−' : '') + num(target);
  const L = txt.length;
  $('bal').style.fontSize = (L <= 6 ? 48 : L <= 8 ? 42 : L <= 10 ? 34 : L <= 12 ? 28 : 22) + 'px';
  if (!animate || reduceMotion() || shown === target) { $('balNum').textContent = txt; shown = target; return; }
  const from = shown, t0 = performance.now(), D = 600;
  const step = now => {
    const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
    const v = from + (target - from) * e;
    const val = p === 1 ? target : Math.round(v);
    $('balNum').textContent = (val < 0 ? '−' : '') + num(val);
    shown = p === 1 ? target : v;
    if (p < 1) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

function render(animate) {
  const list = tx.filter(t => t.d.startsWith(month)).sort((a, b) => b.d.localeCompare(a.d) || b.i - a.i);
  const inc = sum(list, 'i'), exp = sum(list, 'e'), bal = inc - exp;

  $('mlabel').textContent = monthLabel();
  applyCur(); renderToday();
  $('inc').textContent = '+' + rub(inc);
  $('exp').textContent = '−' + rub(exp);
  document.documentElement.dataset.neg = bal < 0 ? '1' : '0';
  paintChrome();
  setBalance(bal, animate);

  // Куда ушли деньги
  const by = {};
  list.filter(x => x.t === 'e').forEach(x => by[x.c] = (by[x.c] || 0) + x.a);
  const rows = Object.entries(by).sort((a, b) => b[1] - a[1]);
  const st = $('stats');
  if (rows.length) {
    st.hidden = false;
    st.innerHTML = '<h2>Куда ушло</h2><div class="sbox"><div class="bar" role="img" aria-label="Расходы по категориям">' +
      rows.map(([c, v]) => '<i style="flex:' + v + ';background:' + colorOf('e', c) + '"></i>').join('') + '</div><ul class="legend">' +
      rows.map(([c, v]) => {
        const p = v / exp * 100;
        return '<li><span class="sw" style="background:' + colorOf('e', c) + '"></span><span>' + esc(c) + '</span><span class="lv">' + rub(v) + '</span><span class="lp">' + (p < 1 ? '<1' : Math.round(p)) + '%</span>' + limBar(c, v) + '</li>';
      }).join('') + '</ul></div>';
  } else { st.hidden = true; st.innerHTML = ''; }

  // Операции по дням
  if (!list.length) {
    $('list').innerHTML = '<div class="empty"><p>В этом месяце пока ничего нет.</p><p class="sub">Напиши внизу, например: «кофе 250».</p></div>';
    return;
  }
  let html = '<h2>Операции</h2>';
  for (const d of [...new Set(list.map(x => x.d))]) {
    const items = list.filter(x => x.d === d);
    const net = sum(items, 'i') - sum(items, 'e');
    html += '<div class="day"><span>' + dayLabel(d) + '</span><span>' + (net ? signed(net) : '') + '</span></div><div class="grp">';
    for (const x of items) {
      const c = colorOf(x.t, x.c);
      html += '<button class="op" data-id="' + x.i + '"><span class="ic" style="background:' + rgba(c, .16) + '">' + icon(x.t, x.c) + '</span>' +
        '<span class="m"><span class="t">' + esc(x.c) + '</span>' + (x.n ? '<span class="n">' + esc(x.n) + '</span>' : '') + '</span>' +
        '<span class="amt' + (x.t === 'i' ? ' inc' : '') + '">' + (x.t === 'i' ? '+' : '−') + rub(x.a) + '</span></button>';
    }
    html += '</div>';
  }
  $('list').innerHTML = html + '<p class="foot">Нажми на операцию, чтобы изменить или удалить.</p>';
}

// ---------- Форма ----------
function renderChips() {
  $('chips').innerHTML = CATS[type].map(([e, n]) => '<button class="chip" aria-pressed="' + (cat === n) + '" data-c="' + n + '">' + e + ' ' + n + '</button>').join('');
  check();
}
function parseAmount() { return parseFloat($('amount').value.replace(/\s/g, '').replace(',', '.')); }
function check() { const a = parseAmount(); $('save').disabled = !(a > 0) || !cat; }
function setType(t) {
  type = t; cat = null;
  $('tE').setAttribute('aria-pressed', t === 'e'); $('tI').setAttribute('aria-pressed', t === 'i');
  $('amountBox').classList.toggle('inc', t === 'i');
  $('save').textContent = editId ? 'Сохранить' : (t === 'e' ? 'Добавить расход' : 'Добавить доход');
  renderChips();
}
let editId = null;
function openSheet() {
  $('q').blur(); editId = null; $('delBtn').hidden = true;
  $('amount').value = ''; $('note').value = ''; $('date').value = today();
  setType('e');
  $('bg').classList.add('open');
  setTimeout(() => $('amount').focus(), 260);
}
function closeSheet() { $('bg').classList.remove('open'); }
let tt;
function toast(m) { const el = $('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 1600); }

$('fab').onclick = openSheet;
$('bg').onclick = e => { if (e.target === $('bg')) closeSheet(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('tE').onclick = () => setType('e');
$('tI').onclick = () => setType('i');
$('amount').oninput = check;
$('chips').onclick = e => { const b = e.target.closest('.chip'); if (b) { cat = b.dataset.c; renderChips(); } };
$('save').onclick = () => {
  const a = Math.round(parseAmount() * 100) / 100;
  if (!(a > 0) || !cat) return;
  const d = $('date').value || today();
  const n = $('note').value.trim();
  if (editId) {
    const x = tx.find(r => r.i === editId);
    if (x) {
      const old = x.d.slice(0, 7);
      Object.assign(x, { t: type, a, c: cat, d, n });
      persist(old); if (old !== d.slice(0, 7)) persist(d.slice(0, 7));
    }
    month = d.slice(0, 7); editId = null;
    buzz('success'); closeSheet(); render(true); toast('Сохранено');
    return;
  }
  tx.push({ i: Date.now(), t: type, a, c: cat, d, n });
  month = d.slice(0, 7);
  persist(month);
  buzz('success'); closeSheet(); render(true); toast('Добавлено'); limitNote(type, cat, month);
};
$('prev').onclick = () => shift(-1);
$('next').onclick = () => shift(1);
function shift(k) {
  const [y, m] = month.split('-').map(Number);
  const d = new Date(y, m - 1 + k, 1);
  month = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  render(true);
}

// Нажатие на операцию открывает её для правки
$('list').onclick = e => {
  const el = e.target.closest('.op'); if (!el) return;
  const x = tx.find(r => r.i === Number(el.dataset.id)); if (!x) return;
  $('q').blur();
  editId = x.i;
  setType(x.t); cat = x.c;
  if (!CATS[x.t].some(c => c[1] === x.c)) CATS[x.t].splice(Math.max(0, CATS[x.t].length - 1), 0, ['🏷️', x.c]);
  renderChips();
  $('amount').value = String(x.a).replace('.', ','); $('date').value = x.d; $('note').value = x.n || '';
  $('save').textContent = 'Сохранить'; $('delBtn').hidden = false; check();
  $('bg').classList.add('open');
};

const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
// Слово совпадает по началу; «=» на конце значит точное слово
const KW = {
  e: [
    ['Продукты', ['продукт','магнит','пятероч','перекрест','лента=','ашан','хлеб','молок','вкусвилл','дикси','самокат','магазин','овощ','фрукт','мяс']],

    ['Здоровье', ['здоров','аптек','лекарств','врач','стоматолог','зуб','таблетк','анализ','больниц']],
    ['Учёба', ['учеб','книг','курс','печат','ксерокс','канцеляр','универ','лекци','тетрад']]
  ],
  i: [

    ['Подработка', ['подработ','смен','склад','халтур']],
    ['Подарки', ['подарил']]
  ]
};
const INCOME_TRIGGERS = ['получил','пришло=','пришли=','перевели'];
const norm = s => s.toLowerCase().replace(/ё/g, 'е');
const pad2 = n => String(n).padStart(2, '0');
function addDays(ds, n) { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function validDate(y, m, d) { const x = new Date(y, m - 1, d); return x.getFullYear() === y && x.getMonth() === m - 1 && x.getDate() === d; }
const hit = (words, kw) => kw.endsWith('=') ? words.includes(kw.slice(0, -1)) : words.some(w => w.startsWith(kw));

// «Кофе 250 вчера», «+18 500 смена», «такси 1,5к 12.10» -> { a, t, c, d, n }
function parse(raw) {
  let s = raw.trim();
  let t = /^\+/.test(s) ? 'i' : 'e';
  s = s.replace(/^\+\s*/, '');
  const T = today(), Y = Number(T.slice(0, 4));
  let d = T;
  const take = (re, ok) => { const m = s.match(re); if (m && (!ok || ok(m))) { s = s.replace(re, ' '); return m; } return null; };

  let m;
  if (take(/(^|\s)позавчера(?=\s|$)/i)) d = addDays(T, -2);
  else if (take(/(^|\s)вчера(?=\s|$)/i)) d = addDays(T, -1);
  else if (take(/(^|\s)сегодня(?=\s|$)/i)) d = T;
  else if ((m = take(/(^|\s)(\d{1,2})\s+(января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)(?=\s|$)/i,
      x => validDate(Y, MONTHS.indexOf(x[3].toLowerCase()) + 1, Number(x[2]))))) {
    d = Y + '-' + pad2(MONTHS.indexOf(m[3].toLowerCase()) + 1) + '-' + pad2(Number(m[2]));
  } else if ((m = take(/(^|\s)(\d{1,2})[./](\d{2})(?:[./](\d{4}|\d{2}))?(?=\s|$)/,
      x => validDate(x[4] ? (x[4].length === 2 ? 2000 + Number(x[4]) : Number(x[4])) : Y, Number(x[3]), Number(x[2]))))) {
    const yy = m[4] ? (m[4].length === 2 ? 2000 + Number(m[4]) : Number(m[4])) : Y;
    d = yy + '-' + m[3] + '-' + pad2(Number(m[2]));
  }

  s = s.replace(/(\d)\s*(?:₽|\$|€|₸|₴|руб(?:лей|ля)?\.?|р\.?)(?![а-яёa-z])/gi, '$1 ');
  let a = 0;
  const am = s.match(/(\d{1,3}(?:[ \u00A0]\d{3})+|\d+)(?:[.,](\d{1,2}))?\s*(тыс\.?|к|k)?(?![а-яёa-z\d])/i);
  if (am) {
    a = parseFloat(am[1].replace(/[ \u00A0]/g, '') + (am[2] ? '.' + am[2] : ''));
    if (am[3]) a *= 1000;
    a = Math.round(a * 100) / 100;
    s = s.replace(am[0], ' ');
  }

  const words = norm(s).split(/[^a-zа-я0-9]+/).filter(Boolean);
  if (t === 'e' && (KW.i.some(([, kws]) => kws.some(k => hit(words, k))) || INCOME_TRIGGERS.some(k => hit(words, k)))) t = 'i';
  let c = 'Другое';
  for (const [name, kws] of KW[t]) if (kws.some(k => hit(words, k))) { c = name; break; }
  if (c === 'Другое') for (const [, name] of ((cfg.cats && cfg.cats[t]) || [])) {
    const k = norm(name).split(/[^a-zа-я0-9]+/)[0];
    if (k && (k.length >= 3 ? words.some(w => w.startsWith(k)) : words.includes(k))) { c = name; break; }
  }

  let n = s.replace(/#/g, '').replace(/\s+/g, ' ').trim();
  if (norm(n) === norm(c)) n = '';
  n = (n.charAt(0).toUpperCase() + n.slice(1)).slice(0, 60);
  return { a, t, c, d, n };
}

const CURS = ['₽','$','€','₸','₴'];
function defaultCur() {

}
const dim = (y, m) => new Date(y, m, 0).getDate();
const isDue = (ds, day) => { const [y, m, d] = ds.split('-').map(Number); return d === Math.min(day, dim(y, m)); };
const total = () => cfg.start + sum(tx, 'i') - sum(tx, 'e');
const plural = (n, f) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? f[0] : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? f[1] : f[2]; };
const numIn = v => { const x = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isNaN(x) ? null : x; };

// Свободно = деньги сейчас − платежи до следующего поступления − резерв. Платежи сегодняшнего дня считаем уже оплаченными.
function budget() {
  if (!cfg.set || !cfg.days.length) return null;
  const T = today();
  let n = 0, next = null;
  for (let i = 1; i <= 62 && !next; i++) { const ds = addDays(T, i); if (cfg.days.some(x => isDue(ds, x))) { next = ds; n = i; } }
  if (!next) return null;
  let pay = 0, cnt = 0;
  for (let i = 1; i < n; i++) { const ds = addDays(T, i); cfg.pays.forEach(p => { if (isDue(ds, p.d)) { pay += p.a; cnt++; } }); }
  const free = Math.round((total() - pay - cfg.reserve) * 100) / 100;
  return { free, per: free / n, n, date: next, pay, cnt };
}

}

// ---------- Импорт / экспорт ----------
function importTx(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { toast('Не получилось прочитать файл'); return; }
  const list = Array.isArray(data) ? data : (data && Array.isArray(data.tx) ? data.tx : null);
  if (!list) { toast('В файле нет операций'); return; }
  if (!cfg.cats) cfg.cats = { e: [], i: [] };
  const known = (tt, n) => CATS[tt].some(x => x[1] === n) || cfg.cats[tt].some(x => x[1] === n);
  const ci = data && !Array.isArray(data) && data.cats;
  if (ci) for (const tt of ['e', 'i']) for (const [e, n] of (ci[tt] || []).slice(0, 40))
    if (typeof n === 'string' && n && !known(tt, n) && cfg.cats[tt].length < 40) cfg.cats[tt].push([String(e || '🏷️').slice(0, 4), n.slice(0, 30)]);
  const key = x => [x.t, Math.round(x.a * 100), x.c, x.d, x.n || ''].join('|');
  const seen = new Set(tx.map(key));
  let id = Date.now(), added = 0;
  const months = new Set();
  for (const r of list.slice(0, 20000)) {
    if (!r || (r.t !== 'e' && r.t !== 'i')) continue;
    const a = Number(r.a);
    if (!(a > 0) || a > 1e12 || !/^\d{4}-\d{2}-\d{2}$/.test(r.d || '')) continue;
    const x = { i: ++id, t: r.t, a: Math.round(a * 100) / 100, c: String(r.c || 'Другое').slice(0, 30), d: r.d, n: String(r.n || '').slice(0, 60) };
    if (!known(x.t, x.c) && cfg.cats[x.t].length < 40) cfg.cats[x.t].push(['🏷️', x.c]);
    if (seen.has(key(x))) continue;
    seen.add(key(x)); tx.push(x); months.add(x.d.slice(0, 7)); added++;
  }
  months.forEach(persist); applyCats(); if (added && !cfg.onb) { cfg.onb = true; hideOnb(); } saveCfg();
  closeBudget(); render(false);
  toast(added ? 'Добавлено операций: ' + added : 'Новых операций нет');
  if (added) { buzz('success'); afterSync('Сохранено в облаке Telegram'); }
}

function limOf(c) { return (cfg.limits && Number(cfg.limits[c])) || 0; }

  const r = spent / L, cls = r > 1 ? ' over' : r > .8 ? ' warn' : '';
  const txt = r > 1 ? 'Перебор ' + rub(spent - L) : 'Осталось ' + rub(L - spent) + ' из ' + rub(L);
  return '<span class="lb' + cls + '"><span class="tr"><i style="width:' + Math.min(100, Math.round(r * 100)) + '%"></i></span><span>' + txt + '</span></span>';
}
function limitNote(t, c, m) {

  if (!cfg.debts) cfg.debts = [];
  if (cfg.debts.length >= 15) { toast('Слишком много долгов'); return; }
  cfg.debts.push({ n, a: Math.round(a * 100) / 100, p: Math.min(a, Math.max(0, Math.round(p * 100) / 100)) });
  saveCfg(); renderDebts(); $('dName').value = ''; $('dTotal').value = ''; $('dPaid').value = ''; buzz('success'); toast('Добавлено');
};
$('dList').onclick = e => {
  const del = e.target.closest('[data-del]'), pay = e.target.closest('[data-pay]');
  if (del) { cfg.debts.splice(Number(del.dataset.del), 1); saveCfg(); renderDebts(); return; }
  if (!pay) return;
  const i = Number(pay.dataset.pay), d = cfg.debts[i];
  const a = numIn($('dList').querySelector('input[data-i="' + i + '"]').value);
  if (!(a > 0)) { toast('Введи сумму'); return; }
  const v = Math.min(a, d.a - d.p);
  d.p = Math.round((d.p + v) * 100) / 100;
  const c = debtCat(), day = today();
  tx.push({ i: Date.now(), t: 'e', a: v, c, d: day, n: 'Долг: ' + d.n });
  persist(day.slice(0, 7)); saveCfg(); render(false); renderDebts(); buzz('success'); toast('Платёж записан в расходы');
};
$('bg5').onclick = e => { if (e.target === $('bg5')) $('bg5').classList.remove('open'); };

// ---------- Меню ----------
const MN = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function openDrawer() {
  $('q').blur();
  const tt = total();
  $('drBal').textContent = (tt < 0 ? '−' : '') + rub(tt);
  $('drFoot').textContent = cloudStatus();
  $('drBg').classList.add('open');
}
function closeDrawer() { $('drBg').classList.remove('open'); }
function openCharts() {
  const [y, m] = month.split('-').map(Number);
  const dim = new Date(y, m, 0).getDate();
  const per = Array(dim).fill(0);
  tx.filter(t => t.t === 'e' && t.d.startsWith(month)).forEach(t => { per[Number(t.d.slice(8, 10)) - 1] += t.a; });
  const mx = Math.max(1, ...per);
  $('chT1').textContent = 'Расходы по дням, ' + monthLabel().toLowerCase();
  $('chDays').innerHTML = per.map(v => '<i style="height:' + Math.max(2, Math.round(v / mx * 100)) + '%;opacity:' + (v ? .9 : .2) + '"></i>').join('');
  const by = {};
  tx.forEach(t => { const k = t.d.slice(0, 7); (by[k] = by[k] || { i: 0, e: 0 })[t.t] += t.a; });
  const keys = Object.keys(by).sort().reverse();
  const big = Math.max(1, ...keys.map(k => Math.max(by[k].i, by[k].e)));
  $('chMonths').innerHTML = keys.map(k => {
    const [yy, mm] = k.split('-').map(Number);
    return '<div class="mrow"><b>' + MN[mm - 1].slice(0, 3) + ' ' + yy + '</b><div class="bars">' +
      '<i style="width:' + by[k].i / big * 100 + '%;background:var(--green)"></i>' +
      '<i style="width:' + by[k].e / big * 100 + '%;background:var(--pos)"></i></div>' +
      '<div class="vals">+' + num(by[k].i) + ' / −' + num(by[k].e) + ' ' + cfg.cur + '</div></div>';
  }).join('') || '<p class="hintp">Пока нет операций</p>';
  $('bg3').classList.add('open');
}
let ctype = 'e';
function renderCats() {
  for (const tt of ['e', 'i']) {
    const box = $(tt === 'e' ? 'catE' : 'catI'); box.textContent = '';
    const custom = ((cfg.cats && cfg.cats[tt]) || []).map(x => x[1]);
    for (const [e, n] of CATS[tt]) {
      const row = document.createElement('div'); row.className = 'crow';
      const sp = document.createElement('span'); sp.textContent = e + ' ' + n;
      const right = document.createElement('div'); right.className = 'cr';
      if (tt === 'e') {
        const li = document.createElement('input'); li.className = 'fi lim'; li.type = 'text'; li.inputMode = 'decimal';
        li.placeholder = 'Лимит'; li.value = limOf(n) ? String(limOf(n)).replace('.', ',') : ''; li.dataset.n = n; li.setAttribute('aria-label', 'Лимит на месяц: ' + n);
        right.appendChild(li);
      }
      row.append(sp, right);
      if (custom.includes(n)) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = '×'; b.setAttribute('aria-label', 'Удалить ' + n);
        b.dataset.t = tt; b.dataset.n = n; right.appendChild(b);
      }
      box.appendChild(row);
    }
  }
}
function openCats() { renderCats(); $('cName').value = ''; $('cEmoji').value = ''; $('bg4').classList.add('open'); }
function addCat() {
  const n = $('cName').value.trim().slice(0, 30), e = ($('cEmoji').value.trim() || '🏷️').slice(0, 4);
  if (!n) { toast('Введи название'); return; }
  if (CATS[ctype].some(x => x[1].toLowerCase() === n.toLowerCase())) { toast('Такая категория уже есть'); return; }
  if (!cfg.cats) cfg.cats = { e: [], i: [] };
  if (cfg.cats[ctype].length >= 40) { toast('Слишком много категорий'); return; }
  cfg.cats[ctype].push([e, n]); applyCats(); saveCfg(); renderCats(); render(false);
  $('cName').value = ''; $('cEmoji').value = ''; buzz('success'); toast('Добавлено');
}
$('menu').onclick = openDrawer;
$('drBg').onclick = e => {
  if (e.target === $('drBg')) return closeDrawer();
  const b = e.target.closest('[data-go]'); if (!b) return;
  closeDrawer();
  const g = b.dataset.go;
  if (g === 'charts') openCharts();
  else if (g === 'cats') openCats();
  else if (g === 'debts') openDebts();
  else if (g === 'budget') openBudget();
  else if (g === 'imp') $('dImp').click();
  else if (g === 'exp') $('dExp').click();
};
$('bg3').onclick = e => { if (e.target === $('bg3')) $('bg3').classList.remove('open'); };
$('bg4').onclick = e => { if (e.target === $('bg4')) $('bg4').classList.remove('open'); };
$('cType').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; ctype = b.dataset.t; $('cType').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); };
$('cAdd').onclick = addCat;
$('cName').addEventListener('keydown', e => { if (e.key === 'Enter') addCat(); });
$('catE').addEventListener('change', e => {
  const li = e.target.closest('input.lim'); if (!li) return;
  const v = numIn(li.value);
  if (!cfg.limits) cfg.limits = {};
  if (v > 0) cfg.limits[li.dataset.n] = v; else delete cfg.limits[li.dataset.n];
  saveCfg(); render(false); toast(v > 0 ? 'Лимит сохранён' : 'Лимит убран');
});
const catBox = e => {
  const b = e.target.closest('button[data-n]'); if (!b) return;
  const tt = b.dataset.t, n = b.dataset.n;
  cfg.cats[tt] = cfg.cats[tt].filter(x => x[1] !== n);
  const i = CATS[tt].findIndex(x => x[1] === n); if (i >= 0) CATS[tt].splice(i, 1);
  saveCfg(); renderCats(); render(false); toast('Удалено. Старые операции остались');
};
$('catE').onclick = catBox; $('catI').onclick = catBox;
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDrawer(); $('bg3').classList.remove('open'); $('bg4').classList.remove('open'); $('bg5').classList.remove('open'); } });

// ---------- Регулярные платежи: автозапись в расходы ----------
function runAutoPays() {
  if (!cfg.pays || !cfg.pays.length) return 0;
  const T = today(); let added = 0, changed = false; const months = new Set();
  for (const p of cfg.pays) {
    if (!p.s) { p.s = T; changed = true; continue; }
    if (p.s >= T) continue;
    const q = parse(p.n || ''); const c = q.t === 'e' ? q.c : 'Другое';
    let [y, m] = p.s.slice(0, 7).split('-').map(Number);
    for (let g = 0; g < 36; g++) {
      const mk = y + '-' + pad2(m);
      if (mk > T.slice(0, 7)) break;
      const due = mk + '-' + pad2(Math.min(p.d, new Date(y, m, 0).getDate()));
      if (due > p.s && due <= T) { tx.push({ i: Date.now() + added, t: 'e', a: p.a, c, d: due, n: p.n }); months.add(mk); added++; }
      if (++m > 12) { m = 1; y++; }
    }
    p.s = T; changed = true;
  }
  months.forEach(persist);
  if (changed) saveCfg();
  return added;
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const n = runAutoPays(); if (n) { render(false); toast('Записано регулярных платежей: ' + n); }
});

// ---------- Экран первого запуска ----------
let onbStep = 0, onbCur = '₽', onbNow = '', onbDays = '';
function onbNeeded() { return !cfg.onb && !cfg.set && !tx.length; }
function hideOnb() { $('onb').hidden = true; }
function finishOnb(save) {
  if (save) {
    cfg.cur = onbCur;
    const now = numIn(onbNow);
    if (now !== null) cfg.start = Math.round(now * 100) / 100;
    cfg.days = [...new Set((onbDays.match(/\d+/g) || []).map(Number).filter(x => x >= 1 && x <= 31))].sort((a, b) => a - b);
    if (now !== null || cfg.days.length) cfg.set = true;
  }
  cfg.onb = true; saveCfg(); hideOnb(); render(true);
  toast('Готово. Напиши внизу, например: кофе 250');
}
function renderOnb() {
  const c = $('onbCard'); c.textContent = '';
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; };
  const dots = el('div', 'dots'); for (let i = 0; i < 3; i++) dots.appendChild(el('i', i === onbStep ? 'on' : ''));
  if (onbStep === 0) {
    c.appendChild(el('div', 'onb-ic', onbCur));
    c.appendChild(el('h1', '', 'Учёт денег без лишнего'));
    const ul = el('ul');
    [['1', 'Пиши трату одной строкой: «кофе 250 вчера». Сумма, дата и категория определятся сами.'],
     ['2', 'Приложение покажет, сколько можно тратить в день до следующих денег.'],
     ['3', 'Данные лежат в твоём Telegram. У приложения нет своего сервера.']].forEach(([n, s]) => { const li = el('li'); li.append(el('b', '', n), el('span', '', s)); ul.appendChild(li); });
    c.appendChild(ul);
    const go = el('button', 'save', 'Начать'); go.onclick = () => { onbStep = 1; renderOnb(); }; c.appendChild(go);
    const imp = el('button', 'lnk', 'У меня уже есть файл с операциями'); imp.onclick = () => $('dFile').click(); c.appendChild(imp);
  } else if (onbStep === 1) {
    c.appendChild(el('h1', '', 'Валюта и остаток'));
    c.appendChild(el('p', '', 'Выбери валюту и напиши, сколько денег у тебя сейчас. Отсюда начнётся расчёт.'));
    const ch = el('div', 'chips');
    CURS.forEach(x => { const b = el('button', 'chip', x); b.type = 'button'; b.setAttribute('aria-pressed', x === onbCur); b.onclick = () => { onbCur = x; renderOnb(); }; ch.appendChild(b); });
    c.appendChild(ch);
    const lb = el('label', 'fl', 'Сколько денег сейчас'); lb.htmlFor = 'onbNow'; c.appendChild(lb);
    const inp = el('input', 'fi'); inp.id = 'onbNow'; inp.type = 'text'; inp.inputMode = 'decimal'; inp.placeholder = '0'; inp.autocomplete = 'off'; inp.value = onbNow;
    inp.oninput = () => { onbNow = inp.value; }; c.appendChild(inp);
    c.appendChild(el('p', 'hintp', 'Можно пропустить и ввести позже в меню «Бюджет и платежи».'));
    const nx = el('button', 'save', 'Дальше'); nx.onclick = () => { onbStep = 2; renderOnb(); }; c.appendChild(nx);
  } else {
    c.appendChild(el('h1', '', 'Когда приходят деньги?'));
    c.appendChild(el('p', '', 'Напиши числа месяца через запятую. Так приложение посчитает, сколько можно тратить в день до следующих денег.'));
    const lb = el('label', 'fl', 'Числа месяца'); lb.htmlFor = 'onbDays'; c.appendChild(lb);
    const inp = el('input', 'fi'); inp.id = 'onbDays'; inp.type = 'text'; inp.inputMode = 'numeric'; inp.placeholder = 'Например: 10, 25'; inp.autocomplete = 'off'; inp.value = onbDays;
    inp.oninput = () => { onbDays = inp.value; }; c.appendChild(inp);
    c.appendChild(el('p', 'hintp', 'Регулярные платежи и лимиты можно добавить позже в меню.'));
    const ok = el('button', 'save', 'Готово'); ok.onclick = () => finishOnb(true); c.appendChild(ok);
  }
  if (onbStep > 0) { const sk = el('button', 'lnk', onbStep === 2 ? 'Пропустить' : 'Назад'); sk.onclick = () => { if (onbStep === 2) finishOnb(true); else { onbStep = 0; renderOnb(); } }; c.appendChild(sk); }
  c.appendChild(dots);
  const f = c.querySelector('input'); if (f && onbStep > 0) setTimeout(() => f.focus({ preventScroll: true }), 50);
}
function startOnb() { if (!onbNeeded()) return; onbCur = cfg.cur; onbStep = 0; $('onb').hidden = false; renderOnb(); }

load().then(() => { applyCats(); if (needSync) { [...new Set(tx.map(x => x.d.slice(0, 7)))].forEach(persist); saveCfg(); } const n = runAutoPays(); render(true); startOnb(); if (n) setTimeout(() => toast('Записано регулярных платежей: ' + n), 600); });
</script>
</body>
